[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: browser end-to-end tests (Playwright); need a running app",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/migrations/*", ".venv/*", "venv/*", "scripts/*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "scripts"]
