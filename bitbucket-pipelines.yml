# =====================================================================
# Bitbucket Pipelines - meg-6schemes (Python: Django / FastAPI)
#
# Runs on every branch push, every pull request, and main:
#   Stage 1 (parallel): secret scan | lint & format | security | unit tests
#   Stage 2:            end-to-end browser tests (Playwright)
#
# No deployment yet. Tool versions are pinned in requirements-dev.txt.
# =====================================================================

image: python:3.12-slim

definitions:
  caches:
    pip-cache: ~/.cache/pip

  services:
    postgres:
      image: postgres:16.16-alpine
      variables:
        POSTGRES_DB: test_db
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test

  steps:
    # ---------------------------------------------------------------
    - step: &secret-scan
        name: Secret scan (gitleaks)
        image: zricethezav/gitleaks:v8.30.1
        clone:
          depth: full          # scan full history, not just the last commit
        script:
          - git config --global --add safe.directory "$BITBUCKET_CLONE_DIR"
          - gitleaks git --redact --verbose .

    # ---------------------------------------------------------------
    - step: &lint
        name: Lint & format (ruff)
        caches:
          - pip-cache
        script:
          - pip install --quiet $(grep -E '^ruff==' requirements-dev.txt)
          - ruff check . --output-format=full
          - ruff format --check --diff .

    # ---------------------------------------------------------------
    - step: &security
        name: Security (bandit + pip-audit)
        caches:
          - pip-cache
        script:
          - pip install --quiet $(grep -E '^(bandit|pip-audit)==' requirements-dev.txt)
          # Static analysis of our own code (config in pyproject.toml)
          - bandit -c pyproject.toml -r . -q
          # Known CVEs in runtime dependencies
          - if [ -f requirements.txt ]; then pip-audit -r requirements.txt --progress-spinner off; else echo "No requirements.txt - skipping pip-audit"; fi

    # ---------------------------------------------------------------
    - step: &unit-tests
        name: Unit & integration tests (pytest)
        caches:
          - pip-cache
        services:
          - postgres
        script:
          - export DATABASE_URL="postgres://test:test@localhost:5432/test_db"
          - pip install --quiet --upgrade pip
          - if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi
          - pip install --quiet -r requirements-dev.txt
          - mkdir -p test-results
          # Exit code 5 = "no tests collected" -> OK until tests are written.
          - >
            pytest -m "not e2e"
            --junitxml=test-results/unit-junit.xml
            --cov --cov-report=term-missing --cov-report=xml:test-results/coverage.xml
            || [ $? -eq 5 ]
        artifacts:
          - test-results/**

    # ---------------------------------------------------------------
    - step: &e2e-tests
        name: End-to-end tests (Playwright)
        # Browsers + system deps preinstalled. Keep the tag in sync with
        # the playwright== pin in requirements-dev.txt.
        image: mcr.microsoft.com/playwright/python:v1.65.2-noble
        size: 2x                 # browsers need the extra memory
        caches:
          - pip-cache
        services:
          - postgres
        script:
          - export DATABASE_URL="postgres://test:test@localhost:5432/test_db"
          - export PIP_BREAK_SYSTEM_PACKAGES=1
          - if [ -f requirements.txt ]; then python3 -m pip install --quiet -r requirements.txt; fi
          - python3 -m pip install --quiet -r requirements-dev.txt
          - mkdir -p test-results
          # Starts Django or FastAPI in the background; writes BASE_URL to .ci_base_url
          - bash scripts/ci/start_app.sh
          - if [ -f .ci_base_url ]; then export BASE_URL="$(cat .ci_base_url)"; fi
          - >
            python3 -m pytest -m e2e
            --browser chromium
            --screenshot only-on-failure
            --video retain-on-failure
            --tracing retain-on-failure
            --output test-results/playwright
            --junitxml=test-results/e2e-junit.xml
            || [ $? -eq 5 ]
        after-script:
          - if [ -f app.log ]; then cp app.log test-results/app.log; fi
        artifacts:
          - test-results/**

pipelines:
  default:
    - parallel: &stage-1
        steps:
          - step: *secret-scan
          - step: *lint
          - step: *security
          - step: *unit-tests
    - step: *e2e-tests

  pull-requests:
    '**':
      - parallel: *stage-1
      - step: *e2e-tests

  branches:
    main:
      - parallel: *stage-1
      - step: *e2e-tests
